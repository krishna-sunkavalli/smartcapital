name: cd

# Build the image, scan it, push to ACR, and roll the Container App — all with
# OIDC federation (no stored cloud credentials). The "production" environment
# gate lets a human approve before anything touches the live worker.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for azure/login OIDC

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      IMAGE: smartcapital
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE:${{ github.sha }}" \
            --image "$IMAGE:latest" \
            .

      - name: ACR login (so Trivy can pull the image to scan)
        run: az acr login --name "$ACR_NAME"

      - name: Trivy scan of the pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/smartcapital:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Roll Container App to new image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE}:${{ github.sha }}" \
            -o none
